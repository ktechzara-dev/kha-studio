name: VisionStudio CI

on:
  push:
    branches: [ "main", "master", "develop" ]
  pull_request:
    branches: [ "main", "master", "develop" ]

jobs:
  build-and-test:
    runs-on: windows-latest

    steps:
    - name: Checkout repository
      uses: actions/checkout@v4

    - name: Setup .NET SDK
      uses: actions/setup-dotnet@v4
      with:
        dotnet-version: '8.0.x'

    - name: Restore dependencies
      run: dotnet restore dotnet/VisionStudio/VisionStudio.sln

    - name: Build Solution
      run: dotnet build dotnet/VisionStudio/VisionStudio.sln --configuration Release --no-restore

    - name: Run Unit Tests
      run: dotnet test dotnet/VisionStudio/VisionStudio.sln --configuration Release --no-build --verbosity normal

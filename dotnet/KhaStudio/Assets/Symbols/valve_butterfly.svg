<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" width="200" height="200">
  <!-- Butterfly Valve with Handwheel (Van bướm tay quay) -->
  <!-- Thân van tròn dạng kẹp Wafer -->
  <circle cx="100" cy="115" r="45" fill="#70757A" stroke="#1E293B" stroke-width="5"/>
  <ellipse cx="100" cy="115" rx="30" ry="12" fill="#FFFFFF" opacity="0.6"/>
  <!-- Đĩa cánh bướm nghiêng (Disc) -->
  <line x1="85" y1="85" x2="115" y2="145" stroke="#1E293B" stroke-width="6"/>
  <!-- Mặt bích 2 bên -->
  <line x1="45" y1="80" x2="45" y2="150" stroke="#1E293B" stroke-width="6"/>
  <line x1="155" y1="80" x2="155" y2="150" stroke="#1E293B" stroke-width="6"/>
  <!-- Cổ trục & Hộp số (Gearbox) -->
  <line x1="100" y1="70" x2="100" y2="48" stroke="#1E293B" stroke-width="6"/>
  <rect x="85" y="32" width="30" height="20" rx="3" fill="#1E293B"/>
  <!-- Vô lăng tay quay (Handwheel) -->
  <ellipse cx="100" cy="22" rx="36" ry="10" fill="none" stroke="#EF4444" stroke-width="5"/>
  <line x1="64" y1="22" x2="136" y2="22" stroke="#EF4444" stroke-width="3"/>
</svg>

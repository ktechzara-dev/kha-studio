<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" width="200" height="200">
  <!-- Industrial Exhaust Fan / Blower (Quạt hút thông gió công nghiệp) -->
  <!-- Khung tròn quạt bảo vệ (Fan housing) -->
  <circle cx="100" cy="100" r="76" fill="#70757A" stroke="#1E293B" stroke-width="6"/>
  <circle cx="100" cy="100" r="66" fill="none" stroke="#FFFFFF" stroke-width="2"/>
  <!-- 4 Cánh quạt động lực học (Impeller blades) -->
  <!-- Cánh trên -->
  <path d="M100 100 C90 70, 75 50, 100 36 C115 50, 110 70, 100 100 Z" fill="#1E293B"/>
  <!-- Cánh dưới -->
  <path d="M100 100 C110 130, 125 150, 100 164 C85 150, 90 130, 100 100 Z" fill="#1E293B"/>
  <!-- Cánh trái -->
  <path d="M100 100 C70 110, 50 125, 36 100 C50 85, 70 90, 100 100 Z" fill="#1E293B"/>
  <!-- Cánh phải -->
  <path d="M100 100 C130 90, 150 75, 164 100 C150 115, 130 110, 100 100 Z" fill="#1E293B"/>
  <!-- Tâm bầu trục quạt -->
  <circle cx="100" cy="100" r="22" fill="#70757A" stroke="#1E293B" stroke-width="4"/>
  <circle cx="100" cy="100" r="10" fill="#FFFFFF"/>
</svg>

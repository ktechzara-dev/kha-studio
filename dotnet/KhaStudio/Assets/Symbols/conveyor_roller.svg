<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" width="200" height="200">
  <!-- Roller Conveyor (Băng tải con lăn) -->
  <!-- Khung ray bên (Side rail) -->
  <rect x="20" y="90" width="160" height="20" rx="3" fill="#70757A" stroke="#1E293B" stroke-width="5"/>
  <!-- Hàng con lăn tròn (Rollers) -->
  <circle cx="35" cy="100" r="16" fill="#1E293B"/>
  <circle cx="35" cy="100" r="6" fill="#FFFFFF"/>
  <circle cx="67" cy="100" r="16" fill="#1E293B"/>
  <circle cx="67" cy="100" r="6" fill="#FFFFFF"/>
  <circle cx="100" cy="100" r="16" fill="#1E293B"/>
  <circle cx="100" cy="100" r="6" fill="#FFFFFF"/>
  <circle cx="133" cy="100" r="16" fill="#1E293B"/>
  <circle cx="133" cy="100" r="6" fill="#FFFFFF"/>
  <circle cx="165" cy="100" r="16" fill="#1E293B"/>
  <circle cx="165" cy="100" r="6" fill="#FFFFFF"/>
  <!-- Chân đỡ ray -->
  <line x1="45" y1="110" x2="35" y2="165" stroke="#1E293B" stroke-width="5"/>
  <line x1="155" y1="110" x2="165" y2="165" stroke="#1E293B" stroke-width="5"/>
  <line x1="25" y1="165" x2="175" y2="165" stroke="#1E293B" stroke-width="5"/>
  <!-- Pallet hàng trên con lăn -->
  <rect x="70" y="55" width="60" height="22" rx="2" fill="#70757A" stroke="#1E293B" stroke-width="3"/>
  <line x1="85" y1="55" x2="85" y2="77" stroke="#1E293B" stroke-width="2"/>
  <line x1="115" y1="55" x2="115" y2="77" stroke="#1E293B" stroke-width="2"/>
</svg>

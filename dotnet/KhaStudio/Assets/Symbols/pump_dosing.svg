<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" width="200" height="200">
  <!-- Dosing / Metering Diaphragm Pump (Bơm định lượng hóa chất) -->
  <!-- Khối động cơ truyền động -->
  <rect x="25" y="65" width="60" height="70" rx="8" fill="#70757A" stroke="#1E293B" stroke-width="5"/>
  <line x1="35" y1="75" x2="35" y2="125" stroke="#1E293B" stroke-width="3"/>
  <line x1="45" y1="75" x2="45" y2="125" stroke="#1E293B" stroke-width="3"/>
  <!-- Núm vi chỉnh lưu lượng (Stroke adjustment knob) -->
  <rect x="10" y="85" width="15" height="30" rx="3" fill="#1E293B"/>
  <!-- Đầu bơm màng (Liquid Head) -->
  <path d="M85 75 L145 75 L155 100 L145 125 L85 125 Z" fill="#70757A" stroke="#1E293B" stroke-width="5"/>
  <!-- Van hút đáy (Suction check valve) -->
  <rect x="105" y="125" width="26" height="35" rx="3" fill="#70757A" stroke="#1E293B" stroke-width="4"/>
  <polygon points="118,140 110,153 126,153" fill="#FFFFFF"/>
  <!-- Van xả trên (Discharge check valve) -->
  <rect x="105" y="40" width="26" height="35" rx="3" fill="#70757A" stroke="#1E293B" stroke-width="4"/>
  <polygon points="118,48 110,61 126,61" fill="#FFFFFF"/>
  <!-- Chân gá đế (Base) -->
  <rect x="40" y="160" width="90" height="15" rx="3" fill="#1E293B"/>
  <!-- Ký hiệu DOSING / % -->
  <text x="118" y="105" font-family="Arial, sans-serif" font-size="14" font-weight="bold" fill="#FFFFFF" text-anchor="middle">ML/H</text>
</svg>

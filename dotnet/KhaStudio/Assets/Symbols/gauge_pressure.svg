<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" width="200" height="200">
  <!-- Pressure Gauge (Đồng hồ đo áp suất mặt kim chuẩn ISA) -->
  <!-- Vành inox bảo vệ bên ngoài -->
  <circle cx="100" cy="85" r="66" fill="#70757A" stroke="#1E293B" stroke-width="6"/>
  <!-- Mặt số trắng (Dial plate) -->
  <circle cx="100" cy="85" r="54" fill="#FFFFFF" stroke="#1E293B" stroke-width="2"/>
  <!-- Các vạch chia độ đo (Ticks) -->
  <line x1="60" y1="105" x2="68" y2="100" stroke="#1E293B" stroke-width="3"/>
  <line x1="55" y1="85" x2="65" y2="85" stroke="#1E293B" stroke-width="3"/>
  <line x1="65" y1="62" x2="74" y2="69" stroke="#1E293B" stroke-width="3"/>
  <line x1="82" y1="48" x2="88" y2="58" stroke="#1E293B" stroke-width="3"/>
  <line x1="100" y1="40" x2="100" y2="52" stroke="#EF4444" stroke-width="3"/>
  <line x1="118" y1="48" x2="112" y2="58" stroke="#EF4444" stroke-width="3"/>
  <line x1="135" y1="62" x2="126" y2="69" stroke="#EF4444" stroke-width="3"/>
  <line x1="145" y1="85" x2="135" y2="85" stroke="#EF4444" stroke-width="3"/>
  <!-- Kim đồng hồ (Indicator pointer) -->
  <polygon points="98,87 102,87 116,56 112,54" fill="#EF4444"/>
  <circle cx="100" cy="85" r="7" fill="#1E293B"/>
  <text x="100" y="112" font-family="Arial, sans-serif" font-size="12" font-weight="bold" fill="#64748B" text-anchor="middle">BAR</text>
  <!-- Chân ren kết nối vào ống (Threaded socket) -->
  <rect x="91" y="151" width="18" height="32" fill="#70757A" stroke="#1E293B" stroke-width="4"/>
  <rect x="85" y="160" width="30" height="8" rx="2" fill="#1E293B"/>
</svg>

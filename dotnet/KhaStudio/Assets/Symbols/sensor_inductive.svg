<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" width="200" height="200">
  <!-- Inductive Proximity Sensor M18 (Cảm biến tiệm cận kim loại) -->
  <!-- Thân ren hình trụ (Threaded barrel) -->
  <rect x="55" y="70" width="105" height="60" rx="3" fill="#70757A" stroke="#1E293B" stroke-width="5"/>
  <!-- Các rãnh ren (Thread lines) -->
  <line x1="75" y1="70" x2="75" y2="130" stroke="#1E293B" stroke-width="3"/>
  <line x1="90" y1="70" x2="90" y2="130" stroke="#1E293B" stroke-width="3"/>
  <line x1="105" y1="70" x2="105" y2="130" stroke="#1E293B" stroke-width="3"/>
  <line x1="120" y1="70" x2="120" y2="130" stroke="#1E293B" stroke-width="3"/>
  <line x1="135" y1="70" x2="135" y2="130" stroke="#1E293B" stroke-width="3"/>
  <!-- 2 đai ốc siết (Lock nuts) -->
  <rect x="78" y="60" width="14" height="80" rx="2" fill="#1E293B"/>
  <rect x="122" y="60" width="14" height="80" rx="2" fill="#1E293B"/>
  <!-- Đầu cảm nhận nhựa xanh/cam (Sensing face) -->
  <path d="M160 70 L178 70 C185 70, 185 130, 178 130 L160 130 Z" fill="#3B82F6" stroke="#1E293B" stroke-width="4"/>
  <!-- Đuôi có đèn LED báo tín hiệu & dây dẫn -->
  <rect x="42" y="80" width="13" height="40" rx="2" fill="#1E293B"/>
  <circle cx="48" cy="100" r="4" fill="#F59E0B"/>
  <path d="M42 100 C20 100, 20 145, 10 145" fill="none" stroke="#1E293B" stroke-width="5"/>
</svg>

<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" width="200" height="200">
  <!-- Storage Silo / Hopper (Silo chứa liệu bột/hạt đáy nón) -->
  <!-- Nóc nón của Silo -->
  <polygon points="100,18 160,50 40,50" fill="#70757A" stroke="#1E293B" stroke-width="5"/>
  <!-- Thân trụ Silo -->
  <rect x="40" y="50" width="120" height="75" fill="#70757A" stroke="#1E293B" stroke-width="5"/>
  <!-- Đáy nón phễu rót (Conical bottom) -->
  <polygon points="40,125 160,125 115,165 85,165" fill="#70757A" stroke="#1E293B" stroke-width="5"/>
  <!-- Van đáy xoay định lượng (Rotary airlock / gate) -->
  <rect x="85" y="165" width="30" height="15" rx="2" fill="#1E293B"/>
  <!-- Khung chân tháp kết cấu (Steel Support Legs) -->
  <line x1="38" y1="90" x2="25" y2="190" stroke="#1E293B" stroke-width="5"/>
  <line x1="162" y1="90" x2="175" y2="190" stroke="#1E293B" stroke-width="5"/>
  <line x1="28" y1="150" x2="85" y2="150" stroke="#1E293B" stroke-width="3"/>
  <line x1="172" y1="150" x2="115" y2="150" stroke="#1E293B" stroke-width="3"/>
  <text x="100" y="92" font-family="Arial, sans-serif" font-size="16" font-weight="bold" fill="#FFFFFF" text-anchor="middle">SILO</text>
</svg>

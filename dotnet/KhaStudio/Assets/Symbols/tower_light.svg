<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" width="200" height="200">
  <!-- Andon Signal Tower Light (Đèn tháp tín hiệu 3 tầng Đỏ - Vàng - Xanh) -->
  <!-- Chóp còi báo động trên đỉnh (Buzzer cap) -->
  <path d="M80 28 L100 16 L120 28 Z" fill="#1E293B"/>
  <rect x="80" y="28" width="40" height="10" fill="#1E293B"/>
  <!-- Tầng 1: Đèn ĐỎ (Red Light) -->
  <rect x="76" y="38" width="48" height="32" rx="4" fill="#EF4444" stroke="#1E293B" stroke-width="4"/>
  <line x1="82" y1="46" x2="118" y2="46" stroke="#FFFFFF" stroke-width="2" opacity="0.6"/>
  <!-- Tầng 2: Đèn VÀNG (Amber Light) -->
  <rect x="76" y="70" width="48" height="32" rx="4" fill="#F59E0B" stroke="#1E293B" stroke-width="4"/>
  <line x1="82" y1="78" x2="118" y2="78" stroke="#FFFFFF" stroke-width="2" opacity="0.6"/>
  <!-- Tầng 3: Đèn XANH (Green Light) -->
  <rect x="76" y="102" width="48" height="32" rx="4" fill="#22C55E" stroke="#1E293B" stroke-width="4"/>
  <line x1="82" y1="110" x2="118" y2="110" stroke="#FFFFFF" stroke-width="2" opacity="0.6"/>
  <!-- Đế đèn (Base module) -->
  <rect x="72" y="134" width="56" height="20" rx="3" fill="#70757A" stroke="#1E293B" stroke-width="4"/>
  <!-- Cột nhôm đỡ (Pole) -->
  <rect x="94" y="154" width="12" height="28" fill="#E2E8F0" stroke="#1E293B" stroke-width="3"/>
  <!-- Chân đế bắt ốc sàn/máy (Foot flange) -->
  <ellipse cx="100" cy="186" rx="32" ry="8" fill="#70757A" stroke="#1E293B" stroke-width="4"/>
</svg>

plugins {
    id 'com.android.application'
}

android {
    namespace 'com.khastudio.admin'
    compileSdk 34

    defaultConfig {
        applicationId "com.khastudio.admin"
        minSdk 24
        targetSdk 34
        versionCode 10506
        versionName "1.5.6"

        testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"
    }

    signingConfigs {
        release {
            storeFile file("release.keystore")
            storePassword "khastudio123"
            keyAlias "khastudio"
            keyPassword "khastudio123"
        }
    }

    buildTypes {
        debug {
            signingConfig signingConfigs.release
        }
        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
            // Sử dụng khóa ký release cố định vĩnh viễn để mọi bản cập nhật không bị lỗi chữ ký xung đột
            signingConfig signingConfigs.release
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    buildFeatures {
        buildConfig true
    }
}

dependencies {
    implementation 'androidx.appcompat:appcompat:1.6.1'
    implementation 'com.google.android.material:material:1.11.0'
    implementation 'androidx.swiperefreshlayout:swiperefreshlayout:1.1.0'
}

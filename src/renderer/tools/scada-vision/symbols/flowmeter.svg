<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" width="200" height="200">
  <!-- Electromagnetic / Vortex Flowmeter (Lưu lượng kế đo lưu lượng dòng chảy) -->
  <!-- Ống đo dẫn dòng chảy (Flow tube) -->
  <rect x="20" y="115" width="160" height="50" rx="4" fill="#70757A" stroke="#1E293B" stroke-width="5"/>
  <!-- Mặt bích 2 đầu -->
  <rect x="20" y="105" width="14" height="70" rx="2" fill="#1E293B"/>
  <rect x="166" y="105" width="14" height="70" rx="2" fill="#1E293B"/>
  <!-- Cổ gắn cảm biến lên bộ chuyển đổi (Neck) -->
  <rect x="91" y="78" width="18" height="37" fill="#1E293B"/>
  <!-- Đầu hiển thị số Transmitter (Display housing) -->
  <circle cx="100" cy="50" r="38" fill="#70757A" stroke="#1E293B" stroke-width="5"/>
  <circle cx="100" cy="50" r="28" fill="#1E293B"/>
  <!-- Màn hình LCD hiển thị số lưu lượng -->
  <rect x="80" y="40" width="40" height="20" rx="2" fill="#0284C7"/>
  <text x="100" y="54" font-family="monospace" font-size="12" font-weight="bold" fill="#FFFFFF" text-anchor="middle">48.5</text>
  <!-- Mũi tên chỉ chiều dòng chảy -->
  <path d="M70 140 L130 140 M120 133 L132 140 L120 147" stroke="#FFFFFF" stroke-width="4" stroke-linecap="round" fill="none"/>
</svg>

<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" width="200" height="200">
  <!-- Industrial Steam Boiler (Nồi hơi công nghiệp) -->
  <!-- Thân bồn nằm ngang bo tròn 2 đầu -->
  <rect x="40" y="60" width="120" height="90" rx="45" fill="#70757A" stroke="#1E293B" stroke-width="6"/>
  <!-- Chân đỡ bệ bê tông -->
  <rect x="55" y="145" width="20" height="35" fill="#334155" stroke="#1E293B" stroke-width="4"/>
  <rect x="125" y="145" width="20" height="35" fill="#334155" stroke="#1E293B" stroke-width="4"/>
  <!-- Ống khói xả khí thải bên phải -->
  <rect x="145" y="25" width="20" height="55" fill="#475569" stroke="#1E293B" stroke-width="4"/>
  <!-- Họng xả hơi & van an toàn trên nóc -->
  <rect x="90" y="35" width="20" height="30" fill="#334155" stroke="#1E293B" stroke-width="4"/>
  <circle cx="100" cy="30" r="10" fill="#EF4444"/>
  <!-- Cửa buồng đốt đầu lò bên trái -->
  <circle cx="50" cy="105" r="22" fill="#1E293B"/>
  <circle cx="50" cy="105" r="10" fill="#F59E0B"/>
</svg>

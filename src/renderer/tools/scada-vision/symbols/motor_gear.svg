<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" width="200" height="200">
  <!-- Gear Motor (Động cơ giảm tốc) -->
  <!-- Thân động cơ -->
  <circle cx="75" cy="100" r="55" fill="#70757A" stroke="#1E293B" stroke-width="6"/>
  <!-- Hộp số giảm tốc (Gearbox) -->
  <path d="M115 60 L170 70 L170 130 L115 140 Z" fill="#70757A" stroke="#1E293B" stroke-width="5"/>
  <!-- Trục ra hộp số -->
  <circle cx="150" cy="100" r="14" fill="#CBD5E1" stroke="#1E293B" stroke-width="4"/>
  <circle cx="150" cy="100" r="5" fill="#1E293B"/>
  <!-- Ký hiệu bánh răng & M -->
  <text x="75" y="112" font-family="Arial, sans-serif" font-size="34" font-weight="bold" fill="#FFFFFF" text-anchor="middle">M</text>
  <!-- Chân đế chung -->
  <rect x="40" y="152" width="115" height="18" rx="4" fill="#70757A" stroke="#1E293B" stroke-width="4"/>
</svg>

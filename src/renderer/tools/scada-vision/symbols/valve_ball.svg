<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" width="200" height="200">
  <!-- Manual Ball Valve (Van bi tay gạt chuẩn ISA P&ID) -->
  <!-- 2 tam giác thân van đối đỉnh -->
  <polygon points="30,70 100,105 30,140" fill="#70757A" stroke="#1E293B" stroke-width="5"/>
  <polygon points="170,70 100,105 170,140" fill="#70757A" stroke="#1E293B" stroke-width="5"/>
  <!-- Mặt bích 2 đầu đường ống (Flanges) -->
  <line x1="30" y1="60" x2="30" y2="150" stroke="#1E293B" stroke-width="6"/>
  <line x1="170" y1="60" x2="170" y2="150" stroke="#1E293B" stroke-width="6"/>
  <!-- Khối bi cầu ở giữa (Ball center) -->
  <circle cx="100" cy="105" r="22" fill="#70757A" stroke="#1E293B" stroke-width="4"/>
  <circle cx="100" cy="105" r="10" fill="#1E293B"/>
  <!-- Cổ van (Stem) -->
  <line x1="100" y1="83" x2="100" y2="50" stroke="#1E293B" stroke-width="6"/>
  <!-- Tay gạt chữ L (Lever handle) -->
  <path d="M96 50 L165 25 L168 33 L104 56 Z" fill="#EF4444" stroke="#1E293B" stroke-width="3"/>
  <circle cx="100" cy="53" r="7" fill="#1E293B"/>
</svg>

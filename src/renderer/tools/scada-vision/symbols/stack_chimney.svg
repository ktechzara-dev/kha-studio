<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" width="200" height="200">
  <!-- Industrial Chimney / Scrubber Stack (Ống khói / tháp xử lý khí thải) -->
  <polygon points="80,30 120,30 135,175 65,175" fill="#70757A" stroke="#1E293B" stroke-width="6"/>
  <!-- Vành đai thép tăng cứng -->
  <line x1="77" y1="65" x2="123" y2="65" stroke="#1E293B" stroke-width="4"/>
  <line x1="73" y1="105" x2="127" y2="105" stroke="#1E293B" stroke-width="4"/>
  <line x1="69" y1="145" x2="131" y2="145" stroke="#1E293B" stroke-width="4"/>
  <!-- Khói trắng bốc lên (Exhaust smoke) -->
  <path d="M90 25 C 80 15, 95 5, 110 10 C 125 5, 130 18, 115 25 Z" fill="#94A3B8" opacity="0.6"/>
  <!-- Họng nối ống khói bên hông -->
  <rect x="40" y="125" width="30" height="30" fill="#334155" stroke="#1E293B" stroke-width="4"/>
</svg>

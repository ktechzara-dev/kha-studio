<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" width="200" height="200">
  <!-- Control Cabinet / Tủ điện SCADA Rittal -->
  <rect x="40" y="20" width="120" height="160" rx="4" fill="#70757A" stroke="#1E293B" stroke-width="6"/>
  <!-- Cửa tủ và khóa chốt -->
  <line x1="40" y1="20" x2="40" y2="180" stroke="#334155" stroke-width="4"/>
  <rect x="145" y="90" width="8" height="20" rx="2" fill="#1E293B"/>
  <!-- Đèn báo pha R-S-T nóc tủ -->
  <circle cx="70" cy="40" r="7" fill="#EF4444"/>
  <circle cx="100" cy="40" r="7" fill="#F59E0B"/>
  <circle cx="130" cy="40" r="7" fill="#10B981"/>
  <!-- Màn hình HMI hoặc đồng hồ đa năng trên cánh tủ -->
  <rect x="65" y="65" width="70" height="45" rx="3" fill="#0F172A" stroke="#38BDF8" stroke-width="2"/>
  <rect x="75" y="75" width="50" height="25" fill="#0284C7"/>
  <!-- Chớp tản nhiệt bên dưới -->
  <line x1="60" y1="135" x2="140" y2="135" stroke="#334155" stroke-width="3"/>
  <line x1="60" y1="145" x2="140" y2="145" stroke="#334155" stroke-width="3"/>
  <line x1="60" y1="155" x2="140" y2="155" stroke="#334155" stroke-width="3"/>
</svg>

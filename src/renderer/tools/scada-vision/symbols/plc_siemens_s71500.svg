<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" width="200" height="200">
  <!-- Siemens S7-1500 Modular PLC Rack -->
  <rect x="20" y="40" width="160" height="120" rx="4" fill="#70757A" stroke="#1E293B" stroke-width="5"/>
  <!-- Ray DIN nhôm phía sau -->
  <line x1="10" y1="100" x2="190" y2="100" stroke="#475569" stroke-width="6"/>
  <!-- Nguồn Power Supply (PM) -->
  <rect x="25" y="45" width="30" height="110" fill="#334155" stroke="#1E293B" stroke-width="2"/>
  <circle cx="40" cy="60" r="4" fill="#10B981"/>
  <!-- CPU S7-1500 với màn hình Display -->
  <rect x="60" y="45" width="45" height="110" fill="#1E293B" stroke="#0284C7" stroke-width="2"/>
  <rect x="68" y="55" width="29" height="25" rx="2" fill="#00646E"/>
  <circle cx="73" cy="90" r="3" fill="#10B981"/>
  <circle cx="82" cy="90" r="3" fill="#F59E0B"/>
  <circle cx="91" cy="90" r="3" fill="#EF4444"/>
  <!-- Module I/O Digital/Analog -->
  <rect x="110" y="45" width="22" height="110" fill="#334155" stroke="#1E293B" stroke-width="2"/>
  <rect x="135" y="45" width="22" height="110" fill="#334155" stroke="#1E293B" stroke-width="2"/>
  <rect x="160" y="45" width="15" height="110" fill="#475569" stroke="#1E293B" stroke-width="2"/>
</svg>

<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" width="200" height="200">
  <!-- AC Induction Motor -->
  <circle cx="100" cy="100" r="72" fill="#70757A" stroke="#1E293B" stroke-width="6"/>
  <circle cx="100" cy="100" r="54" fill="none" stroke="#FFFFFF" stroke-width="2" stroke-dasharray="4,4"/>
  <!-- Hộp cực đấu dây (Terminal Box) -->
  <rect x="80" y="8" width="40" height="24" rx="4" fill="#70757A" stroke="#1E293B" stroke-width="4"/>
  <!-- Cánh tản nhiệt làm mát -->
  <line x1="32" y1="100" x2="16" y2="100" stroke="#1E293B" stroke-width="5"/>
  <line x1="36" y1="75" x2="22" y2="70" stroke="#1E293B" stroke-width="5"/>
  <line x1="36" y1="125" x2="22" y2="130" stroke="#1E293B" stroke-width="5"/>
  <!-- Chân đế động cơ (Mounting Feet) -->
  <path d="M50 162 L40 188 L75 188 L70 168 Z" fill="#70757A" stroke="#1E293B" stroke-width="4"/>
  <path d="M150 162 L160 188 L125 188 L130 168 Z" fill="#70757A" stroke="#1E293B" stroke-width="4"/>
  <!-- Trục & Ký hiệu M -->
  <circle cx="100" cy="100" r="32" fill="#1E293B"/>
  <text x="100" y="112" font-family="Arial, sans-serif" font-size="34" font-weight="bold" fill="#FFFFFF" text-anchor="middle">M</text>
  <text x="100" y="142" font-family="Arial, sans-serif" font-size="12" font-weight="bold" fill="#F8FAFC" text-anchor="middle">3~ AC</text>
</svg>

<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" width="200" height="200">
  <!-- Photoelectric Sensor (Cảm biến quang điện) -->
  <!-- Khối thân cảm biến dạng hộp (Rectangular body) -->
  <rect x="35" y="55" width="85" height="90" rx="8" fill="#70757A" stroke="#1E293B" stroke-width="5"/>
  <!-- Thấu kính thu/phát (Optical lens) -->
  <circle cx="120" cy="85" r="16" fill="#1E293B"/>
  <circle cx="120" cy="85" r="11" fill="#EF4444"/>
  <circle cx="120" cy="115" r="14" fill="#1E293B"/>
  <circle cx="120" cy="115" r="9" fill="#22C55E"/>
  <!-- Tia hồng ngoại/laser chiếu ra -->
  <line x1="138" y1="85" x2="185" y2="85" stroke="#EF4444" stroke-width="3" stroke-dasharray="5,4"/>
  <line x1="138" y1="115" x2="185" y2="115" stroke="#22C55E" stroke-width="3" stroke-dasharray="5,4"/>
  <!-- Đèn LED chỉ thị trạng thái (Output Indicator LED) -->
  <circle cx="55" cy="72" r="6" fill="#F59E0B" stroke="#1E293B" stroke-width="2"/>
  <!-- Cáp nguồn ra phía sau -->
  <path d="M35 125 C15 125, 15 160, 5 160" fill="none" stroke="#1E293B" stroke-width="6"/>
  <text x="75" y="115" font-family="Arial, sans-serif" font-size="14" font-weight="bold" fill="#FFFFFF" text-anchor="middle">OPT</text>
</svg>

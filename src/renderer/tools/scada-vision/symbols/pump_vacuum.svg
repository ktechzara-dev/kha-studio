<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" width="200" height="200">
  <!-- Liquid Ring Vacuum Pump (Bơm hút chân không) -->
  <circle cx="95" cy="100" r="62" fill="#70757A" stroke="#1E293B" stroke-width="6"/>
  <circle cx="110" cy="100" r="38" fill="none" stroke="#FFFFFF" stroke-dasharray="4,4" stroke-width="2.5"/>
  <!-- Ống hút chân không bên trên -->
  <rect x="75" y="16" width="40" height="25" rx="3" fill="#70757A" stroke="#1E293B" stroke-width="5"/>
  <line x1="68" y1="16" x2="122" y2="16" stroke="#1E293B" stroke-width="6"/>
  <!-- Họng xả khí bên phải -->
  <rect x="155" y="85" width="25" height="30" rx="3" fill="#70757A" stroke="#1E293B" stroke-width="5"/>
  <line x1="180" y1="78" x2="180" y2="122" stroke="#1E293B" stroke-width="6"/>
  <!-- Chân bệ đỡ -->
  <rect x="50" y="162" width="90" height="18" rx="4" fill="#1E293B"/>
  <!-- Ký hiệu VAC (Chân không) -->
  <circle cx="95" cy="100" r="24" fill="#1E293B"/>
  <text x="95" y="107" font-family="Arial, sans-serif" font-size="16" font-weight="bold" fill="#FFFFFF" text-anchor="middle">VAC</text>
</svg>

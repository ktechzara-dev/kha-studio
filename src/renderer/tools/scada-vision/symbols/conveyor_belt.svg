<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" width="200" height="200">
  <!-- Belt Conveyor (Băng tải đai công nghiệp) -->
  <!-- Dây đai bao quanh (Conveyor belt loop) -->
  <rect x="25" y="80" width="150" height="40" rx="20" fill="#70757A" stroke="#1E293B" stroke-width="5"/>
  <!-- Rulo chủ động bên trái -->
  <circle cx="45" cy="100" r="16" fill="#1E293B"/>
  <circle cx="45" cy="100" r="6" fill="#FFFFFF"/>
  <!-- Rulo bị động bên phải -->
  <circle cx="155" cy="100" r="16" fill="#1E293B"/>
  <circle cx="155" cy="100" r="6" fill="#FFFFFF"/>
  <!-- Các con lăn đỡ ở giữa (Idlers) -->
  <circle cx="82" cy="100" r="10" fill="#1E293B"/>
  <circle cx="118" cy="100" r="10" fill="#1E293B"/>
  <!-- Khung chân đỡ (Legs) -->
  <line x1="45" y1="120" x2="35" y2="165" stroke="#1E293B" stroke-width="5"/>
  <line x1="155" y1="120" x2="165" y2="165" stroke="#1E293B" stroke-width="5"/>
  <line x1="25" y1="165" x2="175" y2="165" stroke="#1E293B" stroke-width="5"/>
  <!-- Mũi tên hướng tải chạy -->
  <path d="M85 64 L115 64 M110 58 L118 64 L110 70" stroke="#3B82F6" stroke-width="4" stroke-linecap="round" stroke-linejoin="round" fill="none"/>
  <!-- Hộp hàng trên băng tải (Carton box) -->
  <rect x="85" y="45" width="30" height="30" rx="3" fill="#F59E0B" stroke="#1E293B" stroke-width="3"/>
</svg>

<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" width="200" height="200">
  <!-- Servo Motor -->
  <rect x="35" y="45" width="130" height="110" rx="8" fill="#70757A" stroke="#1E293B" stroke-width="6"/>
  <!-- Encoder / Feedback Rear Cap -->
  <rect x="15" y="65" width="20" height="70" rx="4" fill="#70757A" stroke="#1E293B" stroke-width="4"/>
  <!-- Trục ra (Shaft) -->
  <rect x="165" y="85" width="25" height="30" fill="#CBD5E1" stroke="#1E293B" stroke-width="3"/>
  <rect x="180" y="88" width="6" height="12" fill="#1E293B"/>
  <!-- Connector Plugs -->
  <rect x="75" y="25" width="22" height="20" rx="3" fill="#1E293B"/>
  <rect x="110" y="25" width="22" height="20" rx="3" fill="#1E293B"/>
  <!-- Symbol Icon S -->
  <circle cx="100" cy="100" r="32" fill="#1E293B"/>
  <text x="100" y="112" font-family="Arial, sans-serif" font-size="32" font-weight="bold" fill="#38BDF8" text-anchor="middle">S</text>
  <text x="100" y="136" font-family="Arial, sans-serif" font-size="10" font-weight="bold" fill="#FFFFFF" text-anchor="middle">SERVO</text>

<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" width="200" height="200">
  <!-- Delta Robot (Robot Delta gắp tốc độ cao) -->
  <polygon points="40,30 160,30 100,55" fill="#70757A" stroke="#1E293B" stroke-width="5"/>
  <circle cx="65" cy="40" r="10" fill="#1E293B"/>
  <circle cx="135" cy="40" r="10" fill="#1E293B"/>
  <!-- Tay trên -->
  <line x1="65" y1="40" x2="35" y2="90" stroke="#70757A" stroke-width="8" stroke-linecap="round"/>
  <line x1="135" y1="40" x2="165" y2="90" stroke="#70757A" stroke-width="8" stroke-linecap="round"/>
  <!-- Cặp thanh giằng song song (Parallel Rods) -->
  <line x1="32" y1="90" x2="85" y2="155" stroke="#38BDF8" stroke-width="4"/>
  <line x1="42" y1="90" x2="95" y2="155" stroke="#38BDF8" stroke-width="4"/>
  <line x1="168" y1="90" x2="115" y2="155" stroke="#38BDF8" stroke-width="4"/>
  <line x1="158" y1="90" x2="105" y2="155" stroke="#38BDF8" stroke-width="4"/>
  <!-- Bàn gắp End-Effector -->
  <polygon points="80,155 120,155 100,165" fill="#EF4444" stroke="#1E293B" stroke-width="4"/>
  <circle cx="100" cy="175" r="7" fill="#38BDF8"/>
</svg>

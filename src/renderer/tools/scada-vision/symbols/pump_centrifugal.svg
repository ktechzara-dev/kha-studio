<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" width="200" height="200">
  <!-- Centrifugal Pump (Bơm ly tâm công nghiệp) -->
  <!-- Thân ốc xoắn chính (Volute Casing) -->
  <circle cx="95" cy="105" r="58" fill="#70757A" stroke="#1E293B" stroke-width="6"/>
  <!-- Mặt bích hút tâm (Suction Flange) -->
  <rect x="15" y="93" width="24" height="24" rx="2" fill="#70757A" stroke="#1E293B" stroke-width="5"/>
  <line x1="15" y1="88" x2="15" y2="122" stroke="#1E293B" stroke-width="6"/>
  <!-- Họng xả đứng & Mặt bích xả (Discharge Flange) -->
  <path d="M120 55 L160 30 L160 52 L140 68 Z" fill="#70757A" stroke="#1E293B" stroke-width="5"/>
  <rect x="148" y="16" width="24" height="18" rx="2" fill="#70757A" stroke="#1E293B" stroke-width="4"/>
  <line x1="140" y1="16" x2="178" y2="16" stroke="#1E293B" stroke-width="6"/>
  <!-- Chân đế bơm (Mounting Base) -->
  <path d="M55 160 L45 186 L145 186 L135 160 Z" fill="#70757A" stroke="#1E293B" stroke-width="5"/>
  <line x1="35" y1="186" x2="155" y2="186" stroke="#1E293B" stroke-width="6"/>
  <!-- Khối tâm & Mũi tên chỉ chiều quay cánh bơm -->
  <circle cx="95" cy="105" r="26" fill="#1E293B"/>
  <path d="M85 88 A 20 20 0 0 1 112 105 L118 97 L117 114 L100 112 L106 104 A 12 12 0 0 0 88 93 Z" fill="#FFFFFF"/>
</svg>

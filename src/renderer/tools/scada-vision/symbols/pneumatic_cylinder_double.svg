<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" width="200" height="200">
  <!-- Double Acting Pneumatic Cylinder (Xi lanh khí nén 2 chiều tác động kép) -->
  <!-- Nòng xi lanh nhôm (Cylinder Barrel) -->
  <rect x="25" y="65" width="105" height="70" rx="6" fill="#70757A" stroke="#1E293B" stroke-width="5"/>
  <!-- Nắp trước & Nắp sau (Front/Rear End Caps) -->
  <rect x="25" y="60" width="18" height="80" rx="3" fill="#1E293B"/>
  <rect x="112" y="60" width="18" height="80" rx="3" fill="#1E293B"/>
  <!-- 2 Cút nối khí A và B (Pneumatic Ports) -->
  <rect x="30" y="44" width="8" height="16" fill="#3B82F6"/>
  <rect x="117" y="44" width="8" height="16" fill="#3B82F6"/>
  <!-- Ty Piston thò ra ngoài (Piston Rod) -->
  <rect x="130" y="90" width="55" height="20" fill="#E2E8F0" stroke="#1E293B" stroke-width="4"/>
  <!-- Đầu ren bắt ốc ty piston (Rod thread & clevis) -->
  <rect x="182" y="86" width="10" height="28" rx="2" fill="#1E293B"/>
  <!-- Vạch đo hành trình / Cảm biến từ Reed switch -->
  <rect x="65" y="58" width="24" height="6" rx="2" fill="#EF4444"/>
  <text x="75" y="107" font-family="Arial, sans-serif" font-size="14" font-weight="bold" fill="#FFFFFF" text-anchor="middle">CYL</text>
</svg>

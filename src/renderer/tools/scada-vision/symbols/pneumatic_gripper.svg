<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" width="200" height="200">
  <!-- Pneumatic Gripper 2-Finger (Tay kẹp gắp khí nén 2 chấu) -->
  <!-- Khối thân xi lanh kẹp -->
  <rect x="55" y="75" width="90" height="95" rx="8" fill="#70757A" stroke="#1E293B" stroke-width="5"/>
  <rect x="75" y="115" width="50" height="35" rx="4" fill="#1E293B"/>
  <text x="100" y="138" font-family="Arial, sans-serif" font-size="14" font-weight="bold" fill="#FFFFFF" text-anchor="middle">GRIP</text>
  <!-- Rãnh trượt con trượt gá chấu kẹp -->
  <rect x="40" y="60" width="120" height="16" rx="2" fill="#1E293B"/>
  <!-- Chấu kẹp trái (Left Finger) -->
  <path d="M50 60 L50 20 L68 20 L68 45 L60 60 Z" fill="#70757A" stroke="#1E293B" stroke-width="4"/>
  <!-- Chấu kẹp phải (Right Finger) -->
  <path d="M150 60 L150 20 L132 20 L132 45 L140 60 Z" fill="#70757A" stroke="#1E293B" stroke-width="4"/>
  <!-- Phôi hoặc mũi tên kẹp phôi -->
  <path d="M72 32 L88 32 M128 32 L112 32" stroke="#EF4444" stroke-width="3"/>
  <polygon points="88,29 95,32 88,35" fill="#EF4444"/>
  <polygon points="112,29 105,32 112,35" fill="#EF4444"/>
</svg>

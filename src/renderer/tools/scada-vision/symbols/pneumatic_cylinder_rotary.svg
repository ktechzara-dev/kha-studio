<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" width="200" height="200">
  <!-- Rotary Pneumatic Actuator (Xi lanh xoay góc / mâm xoay khí nén) -->
  <!-- Thân vuông nhôm định hình -->
  <rect x="35" y="35" width="130" height="130" rx="16" fill="#70757A" stroke="#1E293B" stroke-width="6"/>
  <!-- Mâm xoay tròn trung tâm (Rotary table) -->
  <circle cx="100" cy="100" r="48" fill="#1E293B"/>
  <circle cx="100" cy="100" r="40" fill="#70757A" stroke="#FFFFFF" stroke-width="2"/>
  <!-- Lỗ định vị trên mâm xoay -->
  <circle cx="80" cy="80" r="4" fill="#FFFFFF"/>
  <circle cx="120" cy="80" r="4" fill="#FFFFFF"/>
  <circle cx="80" cy="120" r="4" fill="#FFFFFF"/>
  <circle cx="120" cy="120" r="4" fill="#FFFFFF"/>
  <!-- Mũi tên chỉ chiều xoay 90/180 độ -->
  <path d="M78 100 A 22 22 0 1 1 122 100" fill="none" stroke="#FFFFFF" stroke-width="4"/>
  <polygon points="122,94 130,105 118,107" fill="#FFFFFF"/>
  <!-- Cút khí cấp xoay -->
  <rect x="18" y="70" width="17" height="12" fill="#3B82F6"/>
  <rect x="18" y="118" width="17" height="12" fill="#3B82F6"/>
</svg>

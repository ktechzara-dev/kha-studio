<!doctype html>
<html lang="vi">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <meta http-equiv="Content-Security-Policy" content="default-src 'self'; img-src 'self' data:; connect-src 'none'; style-src 'self' 'unsafe-inline'; script-src 'self' 'unsafe-inline';">
  <title>Automation Project Master (APM) · Kha Studio</title>
  <link rel="stylesheet" href="css/app.css">
</head>
<body>
  <div class="app">
    <aside class="sidebar" id="sidebar">
      <div class="brand">
        <div class="brandmark">APM</div>
        <div>
          <strong>Automation<br>Project Master</strong>
          <small>KHA STUDIO · V4.2.1</small>
        </div>
      </div>
      <div class="nav-label">KHÔNG GIAN LÀM VIỆC</div>
      <nav id="nav" aria-label="Chức năng ứng dụng"></nav>
      <div class="sidebar-foot">
        <span id="runtime-label">Kha Studio · Offline</span>
        <small>V4.2.1 · Buitapp System</small>
      </div>
    </aside>

    <main class="main">
      <header class="topbar">
        <button class="icon-btn header-mobile" data-action="menu" id="mobile-menu" aria-label="Mở menu">
          <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M3 6h18M3 12h18M3 18h18"/></svg>
        </button>
        <div class="crumb">
          <strong id="current-view">Tổng quan</strong>
          <span>Hồ sơ kỹ thuật tự động hóa</span>
        </div>
        <div class="top-actions">
          <div class="save-status" id="save-status" role="status"></div>
          <div id="publish-chip-container"></div>
          <button class="btn small primary" data-action="publish-now" id="btn-publish-topbar" title="Cập nhật bản snapshot lên thư mục Google Drive">
            <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 16V4M7 9l5-5 5 5M4 16v5h16v-5"/></svg>
            <span>Cập nhật lên</span>
          </button>
          <button class="icon-btn" data-action="open-help" id="btn-help-topbar" title="Trợ giúp & Hướng dẫn chia sẻ" aria-label="Trợ giúp">
            <svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="9"/><path d="M9 9a3 3 0 1 1 4 2.8c-.8.3-1 1.2-1 2.2M12 17v.1"/></svg>
          </button>
          <select id="project-picker" class="project-select" aria-label="Chọn dự án"></select>
          <div id="coach-mark-container"></div>
        </div>
      </header>

      <div class="content" id="content"></div>
    </main>
  </div>

  <div id="modals"></div>
  <div class="toast-region" id="toasts" aria-live="polite"></div>

  <button class="back-to-top" id="apm-btn-back-to-top" title="Cuộn lên đầu trang" aria-label="Cuộn lên đầu trang">
    <svg viewBox="0 0 24 24" width="20" height="20" stroke="currentColor" fill="none" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
      <polyline points="18 15 12 9 6 15"></polyline>
    </svg>
  </button>

  <!-- Scripts -->
  <script src="js/messages.vi.js"></script>
  <script src="data/template_files_base64.js"></script>
  <script src="data/master_data.js"></script>
  <script src="js/core.js"></script>
  <script src="js/app.js"></script>
</body>
</html>

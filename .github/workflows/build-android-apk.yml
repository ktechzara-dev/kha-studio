name: Build Android APK (Kha Studio Admin)

on:
  push:
    branches: [ "main" ]
    paths:
      - "android/**"
      - "src/renderer/admin-mobile.html"
      - ".github/workflows/build-android-apk.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-apk:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Copy latest mobile web assets to Android
        run: |
          mkdir -p android/app/src/main/assets
          cp src/renderer/admin-mobile.html android/app/src/main/assets/
          cp src/renderer/admin-mobile-manifest.json android/app/src/main/assets/
          cp src/renderer/shell/qrcode.min.js android/app/src/main/assets/

      - name: Build Android APK with Gradle Wrapper
        working-directory: ./android
        run: |
          gradle wrapper --gradle-version 8.6
          chmod +x gradlew
          ./gradlew assembleRelease --stacktrace

      - name: Prepare APK artifact
        run: |
          mkdir -p build-output
          cp android/app/build/outputs/apk/release/*.apk build-output/KhaStudio-Admin.apk
          ls -la build-output/

      - name: Upload APK as Workflow Artifact
        uses: actions/upload-artifact@v4
        with:
          name: KhaStudio-Admin-APK
          path: build-output/KhaStudio-Admin.apk

      - name: Attach APK to GitHub Release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          LATEST_TAG="v1.5.0"
          echo "Target release tag: $LATEST_TAG"
          if ! gh release view "$LATEST_TAG" >/dev/null 2>&1; then
            echo "Creating release $LATEST_TAG..."
            gh release create "$LATEST_TAG" build-output/KhaStudio-Admin.apk --title "Kha Studio $LATEST_TAG" --notes "Bản phát hành cập nhật $LATEST_TAG: Sửa lỗi tự động cập nhật OTA trên Android (User-Agent header & FileProvider), bổ sung nút tải trực tiếp APK, quản lý dự án & timemark camera."
          else
            echo "Uploading KhaStudio-Admin.apk to release $LATEST_TAG..."
            gh release upload "$LATEST_TAG" build-output/KhaStudio-Admin.apk --clobber
          fi
          # Cập nhật song song vào release v1.4.9
          gh release upload "v1.4.9" build-output/KhaStudio-Admin.apk --clobber || true


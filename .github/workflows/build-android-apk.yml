name: Build Android APK (Kha Studio Admin)

on:
  push:
    branches: [ "main" ]
    paths:
      - "android/**"
      - "src/renderer/admin-mobile.html"
      - ".github/workflows/build-android-apk.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-apk:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Copy latest mobile web assets to Android
        run: |
          mkdir -p android/app/src/main/assets
          cp src/renderer/admin-mobile.html android/app/src/main/assets/
          cp src/renderer/admin-mobile-manifest.json android/app/src/main/assets/
          cp src/renderer/shell/qrcode.min.js android/app/src/main/assets/

      - name: Build Android APK with Gradle Wrapper
        working-directory: ./android
        run: |
          gradle wrapper --gradle-version 8.6
          chmod +x gradlew
          ./gradlew assembleRelease --stacktrace

      - name: Prepare APK artifact
        run: |
          mkdir -p build-output
          cp android/app/build/outputs/apk/release/*.apk build-output/KhaStudio-Admin.apk
          ls -la build-output/

      - name: Upload APK as Workflow Artifact
        uses: actions/upload-artifact@v4
        with:
          name: KhaStudio-Admin-APK
          path: build-output/KhaStudio-Admin.apk

      - name: Attach APK to GitHub Release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          LATEST_TAG="v1.5.2"
          echo "Target release tag: $LATEST_TAG"
          if ! gh release view "$LATEST_TAG" >/dev/null 2>&1; then
            echo "Creating release $LATEST_TAG..."
            gh release create "$LATEST_TAG" build-output/KhaStudio-Admin.apk --title "Kha Studio $LATEST_TAG" --notes "Bản phát hành cập nhật $LATEST_TAG: Realtime Team Chat & Online Presence, phân loại và lọc nhật ký theo từng kỹ sư hiện trường, sửa triệt để lỗi hiển thị font Tiếng Việt Sếp Kha, tối ưu hóa giao diện kính mờ Industrial Glassmorphism."
          else
            echo "Uploading KhaStudio-Admin.apk to release $LATEST_TAG..."
            gh release upload "$LATEST_TAG" build-output/KhaStudio-Admin.apk --clobber
          fi
          # Cập nhật song song vào release v1.5.1 và v1.5.0 để các bản cũ tự động kéo về
          gh release upload "v1.5.1" build-output/KhaStudio-Admin.apk --clobber || true
          gh release upload "v1.5.0" build-output/KhaStudio-Admin.apk --clobber || true


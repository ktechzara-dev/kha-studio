name: Build Android APK (Kha Studio Admin)

on:
  push:
    branches: [ "main" ]
    paths:
      - "android/**"
      - "src/renderer/admin-mobile.html"
      - ".github/workflows/build-android-apk.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-apk:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v3

      - name: Copy latest mobile web assets to Android
        run: |
          mkdir -p android/app/src/main/assets
          cp src/renderer/admin-mobile.html android/app/src/main/assets/
          cp src/renderer/admin-mobile-manifest.json android/app/src/main/assets/
          cp src/renderer/shell/qrcode.min.js android/app/src/main/assets/

      - name: Build Android APK with Gradle
        working-directory: ./android
        run: |
          gradle assembleRelease --stacktrace

      - name: Prepare APK artifact
        run: |
          mkdir -p build-output
          cp android/app/build/outputs/apk/release/*.apk build-output/KhaStudio-Admin.apk
          ls -la build-output/

      - name: Upload APK as Workflow Artifact
        uses: actions/upload-artifact@v4
        with:
          name: KhaStudio-Admin-APK
          path: build-output/KhaStudio-Admin.apk

      - name: Attach APK to GitHub Release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          # Tìm release mới nhất hoặc v1.4.7 để gắn file APK vào
          LATEST_TAG=$(gh release list --limit 1 | awk '{print $1}')
          if [ -n "$LATEST_TAG" ]; then
            echo "Uploading KhaStudio-Admin.apk to release $LATEST_TAG..."
            gh release upload "$LATEST_TAG" build-output/KhaStudio-Admin.apk --clobber || true
          fi
